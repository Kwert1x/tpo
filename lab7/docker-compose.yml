services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpo-jenkins
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${OPENBMC_IMAGE_PATH}:/opt/openbmc/obmc-phosphor-image-romulus.static.mtd:ro

volumes:
  jenkins_home:
    name: tpo_jenkins_home
