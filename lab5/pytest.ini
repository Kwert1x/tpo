[pytest]
addopts = -ra -v
testpaths = .
python_files = test_redfish.py
markers =
    redfish: tests that use the OpenBMC Redfish API
    power: test that can change the managed system power state
    ipmi: test that compares Redfish and IPMI sensor readings
filterwarnings =
    ignore:Unverified HTTPS request:urllib3.exceptions.InsecureRequestWarning
